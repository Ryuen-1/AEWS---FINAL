<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Academic Early Warning System - Monitor student academic performance and provide early intervention support." />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json" />
    <title>Academic Early Warning System</title>
  </head>
  <body>
    <a href="#main-content" class="sr-only sr-only-focusable">Skip to main content</a>
    <div id="root" role="main" id="main-content"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope)
            })
            .catch((error) => {
              console.log('ServiceWorker registration failed: ', error)
            })
        })
      }
    </script>
  </body>
</html>
